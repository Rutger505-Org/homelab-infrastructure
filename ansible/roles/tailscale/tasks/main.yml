- name: Add Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/{{ ansible_facts.distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: >
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/debian {{ ansible_facts.distribution_release }} main
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true

- name: Enable IP forwarding for subnet routing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    mode: "0644"
  when: tailscale_advertise_routes | length > 0
  notify: Reload sysctl

- name: Apply sysctl before advertising routes
  ansible.builtin.meta: flush_handlers

- name: Read Tailscale state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join the tailnet
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ tailscale_oauth_secret }}?ephemeral=false&preauthorized=true
    --advertise-tags={{ tailscale_tag }}
    --hostname={{ inventory_hostname }}
  when: (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'
  changed_when: true
  no_log: true

- name: Advertise routes
  ansible.builtin.command: tailscale set --advertise-routes={{ tailscale_advertise_routes | join(',') }}
  changed_when: false
