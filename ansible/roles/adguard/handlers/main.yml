# Not a service restart: nftables.service flushes the whole ruleset on stop.
- name: Reload nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

- name: Restart adguard
  ansible.builtin.systemd_service:
    name: adguard
    state: restarted
    daemon_reload: true
  # The unit does not exist yet in a check-mode run of a fresh install.
  when: not ansible_check_mode or adguard_unit_file.stat.exists
