adguard_version: "v0.107.79"
adguard_dir: /var/lib/adguard
adguard_web_port: 80
# Only used to seed the first config. AdGuard Home rewrites its config itself,
# so after the first run settings are changed in the web UI, not here.
adguard_upstream_dns:
  - https://dns.quad9.net/dns-query
  - https://cloudflare-dns.com/dns-query
adguard_bootstrap_dns:
  - 9.9.9.9
  - 1.1.1.1
adguard_admin_user: admin
# bcrypt hash of the web UI password, e.g. from `htpasswd -nbBC 10 "" <password>`.
adguard_admin_password_hash: "{{ lookup('ansible.builtin.env', 'ADGUARD_ADMIN_PASSWORD_HASH') }}"

# DHCP for the LAN: the Ziggo modem refuses a private address as DNS server, so
# AdGuard Home hands out the leases and itself as DNS server instead. Unlike the
# rest of the config, Ansible owns the `dhcp` settings and writes them back on
# every deploy, except the on/off switch: that stays in the web UI and defaults to
# off, so a deploy never starts a second DHCP server next to the modem's. Turn it
# on by hand while switching the modem's DHCP off.
#
# adguard_dhcp_range_start and adguard_dhcp_range_end are set per host in
# inventory.yml: every instance leases a separate part of .20-.180 (well below
# the static .199-.250), and every lease lists all instances as DNS servers,
# so clients keep resolving when one of them is down.
adguard_dhcp_dns_servers: "{{ groups['adguard'] | map('extract', hostvars, 'ansible_host') | list }}"
adguard_dhcp_lease_duration: 86400
