# Not a service restart: nftables.service flushes the whole ruleset on stop.
- name: Reload nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: Restart seaweedfs
  ansible.builtin.systemd_service:
    name: seaweedfs
    state: restarted
    daemon_reload: true
