- name: Check S3 credentials
  ansible.builtin.assert:
    that:
      - seaweedfs_admin_access_key | length > 0
      - seaweedfs_admin_secret_key | length > 0
    fail_msg: Set SEAWEEDFS_ADMIN_ACCESS_KEY and SEAWEEDFS_ADMIN_SECRET_KEY.
    quiet: true
  no_log: true

# The S3 gRPC port cannot be bound separately from the S3 port, and it accepts
# unauthenticated identity changes. Only SSH and S3 are reachable from the LAN.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables

- name: Write firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
  notify: Reload nftables

- name: Load firewall rules on boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Read data disk filesystem
  ansible.builtin.command: blkid -o value -s TYPE {{ seaweedfs_data_device }}
  register: seaweedfs_data_fs
  changed_when: false
  failed_when: seaweedfs_data_fs.rc not in [0, 2]

# Only ever formats an empty disk; blkid exits 2 when it finds no filesystem.
- name: Format data disk
  ansible.builtin.command: mkfs.ext4 -L seaweedfs-data {{ seaweedfs_data_device }}
  when: seaweedfs_data_fs.rc == 2
  changed_when: true

- name: Create data mount point
  ansible.builtin.file:
    path: "{{ seaweedfs_data_dir }}"
    state: directory
    mode: "0755"

- name: Add data disk to fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^\\S+\\s+{{ seaweedfs_data_dir }}\\s"
    line: "LABEL=seaweedfs-data {{ seaweedfs_data_dir }} ext4 defaults,nofail 0 2"

- name: Check data disk mount
  ansible.builtin.command: findmnt --mountpoint {{ seaweedfs_data_dir }}
  register: seaweedfs_data_mount
  changed_when: false
  failed_when: false

# ansible.posix.mount is not in ansible-core, which is all CI installs.
- name: Mount data disk  # noqa: command-instead-of-module
  ansible.builtin.command: mount {{ seaweedfs_data_dir }}
  when: seaweedfs_data_mount.rc != 0
  changed_when: true

- name: Create seaweedfs user
  ansible.builtin.user:
    name: seaweedfs
    system: true
    shell: /usr/sbin/nologin
    home: "{{ seaweedfs_data_dir }}"
    create_home: false

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: seaweedfs
    mode: "{{ item.mode }}"
  loop:
    - { path: "/opt/seaweedfs/{{ seaweedfs_version }}", owner: root, mode: "0755" }
    - { path: /etc/seaweedfs, owner: root, mode: "0750" }
    - { path: "{{ seaweedfs_data_dir }}", owner: seaweedfs, mode: "0750" }

# One directory per version, so bumping seaweedfs_version installs and switches
# to the new binary and the old one stays around for a rollback.
- name: Download SeaweedFS
  ansible.builtin.unarchive:
    src: https://github.com/seaweedfs/seaweedfs/releases/download/{{ seaweedfs_version }}/linux_amd64.tar.gz
    dest: /opt/seaweedfs/{{ seaweedfs_version }}
    remote_src: true
    creates: /opt/seaweedfs/{{ seaweedfs_version }}/weed

- name: Link weed binary
  ansible.builtin.file:
    src: /opt/seaweedfs/{{ seaweedfs_version }}/weed
    dest: /usr/local/bin/weed
    state: link
  notify: Restart seaweedfs

# weed reads master.toml from /etc/seaweedfs/.
- name: Write master config
  ansible.builtin.copy:
    dest: /etc/seaweedfs/master.toml
    content: |
      [master.volume_growth]
      copy_1 = 1
    owner: root
    group: seaweedfs
    mode: "0640"
  notify: Restart seaweedfs

- name: Write S3 identities
  ansible.builtin.template:
    src: s3.json.j2
    dest: /etc/seaweedfs/s3.json
    owner: root
    group: seaweedfs
    mode: "0640"
  notify: Restart seaweedfs
  no_log: true

- name: Write systemd unit
  ansible.builtin.template:
    src: seaweedfs.service.j2
    dest: /etc/systemd/system/seaweedfs.service
    mode: "0644"
  notify: Restart seaweedfs

- name: Enable seaweedfs
  ansible.builtin.systemd_service:
    name: seaweedfs
    enabled: true
    state: started
    daemon_reload: true

- name: Apply config changes before creating buckets
  ansible.builtin.meta: flush_handlers

- name: List buckets
  ansible.builtin.command: weed shell
  args:
    stdin: s3.bucket.list
  register: seaweedfs_bucket_list
  retries: 30
  delay: 2
  until: seaweedfs_bucket_list.rc == 0 and 'error' not in seaweedfs_bucket_list.stdout | lower
  changed_when: false

- name: Create buckets
  ansible.builtin.command: weed shell
  args:
    stdin: s3.bucket.create --name {{ item }}
  loop: "{{ seaweedfs_buckets }}"
  when: item not in (seaweedfs_bucket_list.stdout_lines | map('trim') | map('split') | map('first') | list)
  changed_when: true
