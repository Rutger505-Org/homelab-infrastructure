# Caddy with the Cloudflare DNS module, built by caddyserver.com's download
# service. Building takes a few minutes, hence the long download timeout.
caddy_version: "v2.11.7"
caddy_download_url: "https://caddyserver.com/api/download?os=linux&arch=amd64&p=github.com%2Fcaddy-dns%2Fcloudflare&version={{ caddy_version }}"
caddy_data_dir: /var/lib/caddy
caddy_domain: homelab.rutgerpronk.com
# Own token with only Zone:DNS:Edit on rutgerpronk.com, for the DNS-01 challenge
# of the wildcard certificate. It sits on the proxy, so a leak there cannot touch
# rutgerpronk.nl or the redirect rules that the dns/ token can.
caddy_cloudflare_api_token: "{{ lookup('ansible.builtin.env', 'CADDY_CLOUDFLARE_API_TOKEN') }}"

# <name>.homelab.rutgerpronk.com => upstream. The bare domain serves a page
# linking all of them.
#   upstream:      URL Caddy proxies to
#   insecure_tls:  skip certificate checks for an https upstream with a self-signed certificate
#   upstream_host: Host header and TLS server name to send, for name-based upstreams like Traefik
caddy_routes:
  adguard:
    upstream: http://192.168.178.205:80
  openclaw:
    upstream: http://192.168.178.210:18789
  proxmox-lade:
    upstream: https://192.168.178.200:8006
    insecure_tls: true
  proxmox-prodesk:
    upstream: https://192.168.178.199:8006
    insecure_tls: true
  home-assistant:
    upstream: http://192.168.178.215:8123
  # Grafana's own MetalLB address in k3s (grafana_load_balancer_ip in kubernetes-infrastructure).
  grafana:
    upstream: http://192.168.178.231:80
  # Pulse's MetalLB address in k3s (pulse_load_balancer_ip in kubernetes-infrastructure).
  pulse:
    upstream: http://192.168.178.232:7655
  # The finance app's MetalLB address in k3s (deploy/main.tf in Rutger505-Org/finance).
  finance:
    upstream: http://192.168.178.234:80
