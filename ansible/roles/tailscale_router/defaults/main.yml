# OAuth client secret with the auth_keys write scope and tailscale_router_tag.
# Unlike an auth key it never expires, so a rebuild can always rejoin.
tailscale_router_oauth_secret: "{{ lookup('ansible.builtin.env', 'TAILSCALE_ROUTER_OAUTH_SECRET') }}"
tailscale_router_tag: tag:homelab-router
# Approved automatically through autoApprovers in the tailnet policy.
tailscale_router_routes:
  - 192.168.178.0/24
