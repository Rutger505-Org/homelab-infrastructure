- name: Check k3s token
  ansible.builtin.assert:
    that:
      - k3s_role in ['server', 'agent']
      - k3s_token | length > 0
      # A real bundle is a few KB; an empty one means the export failed.
      - k3s_role == 'agent' or k3s_ca_bundle | length > 1000
    fail_msg: Set K3S_TOKEN and K3S_CA_BUNDLE, and k3s_role to server or agent on the play.
    quiet: true
  no_log: true

- name: Create config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# The install script and k3s both read this, so the token never ends up in the
# systemd unit or the process list.
- name: Write k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart k3s

# k3s only uses CAs that are on disk before its first start, and never
# replaces them after.
- name: Restore the cluster CAs
  when: k3s_role == 'server'
  block:
    - name: Check for existing CAs
      ansible.builtin.stat:
        path: "{{ k3s_tls_dir }}/server-ca.crt"
      register: k3s_ca_present

    - name: Create TLS directory
      ansible.builtin.file:
        path: "{{ k3s_tls_dir }}"
        state: directory
        mode: "0700"
      when: not k3s_ca_present.stat.exists

    - name: Unpack the CAs
      ansible.builtin.shell:
        cmd: set -o pipefail && base64 -d | tar -xz -C {{ k3s_tls_dir }}
        stdin: "{{ k3s_ca_bundle }}"
        executable: /bin/bash
      no_log: true
      when: not k3s_ca_present.stat.exists
      changed_when: true

- name: Read installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  check_mode: false
  failed_when: false

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "{{ k3s_role }}"
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout
  changed_when: true

- name: Start k3s on boot
  ansible.builtin.systemd_service:
    name: "{{ k3s_service }}"
    enabled: true
    state: started
