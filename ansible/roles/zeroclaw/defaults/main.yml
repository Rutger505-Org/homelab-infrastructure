# ZeroClaw as a possible replacement for OpenClaw.
# Release archive: the zeroclaw binary plus the web dashboard in web/dist.
# Arch's own zeroclaw package lags behind and ships no dashboard.
zeroclaw_version: "0.8.7"
zeroclaw_sha256: e10e6e4ba7bf8a081af4a8769d8c16ca3eb48e8e897eac42b94ca4335b120a34
zeroclaw_download_url: https://github.com/zeroclaw-labs/zeroclaw/releases/download/v{{ zeroclaw_version }}/zeroclaw-x86_64-unknown-linux-gnu.tar.gz
# Runs the daemon; config, memory and sessions live in its ~/.zeroclaw.
zeroclaw_user: "{{ ansible_user }}"
zeroclaw_gateway_port: 42617
# ~/.zeroclaw/.env and .secret_key. Only written when missing: the sync adds
# new secrets to .env on the VM, so the copy here goes stale. config.toml's
# secrets are encrypted with .secret_key, so both must come from the same VM.
zeroclaw_env: "{{ lookup('ansible.builtin.env', 'ZEROCLAW_ENV') }}"
zeroclaw_secret_key: "{{ lookup('ansible.builtin.env', 'ZEROCLAW_SECRET_KEY') }}"
# GitHub key of the VM (zeroclaw-vm-managed on Rutger505): zeroclaw-config,
# dev-env and the project repos.
zeroclaw_ssh_private_key: "{{ lookup('ansible.builtin.env', 'ZEROCLAW_SSH_PRIVATE_KEY') }}"
# Same read-only client certificate as the OpenClaw VM.
zeroclaw_readonly_kubeconfig: "{{ lookup('ansible.builtin.env', 'OPENCLAW_READONLY_KUBECONFIG') }}"
# The agent's tools: what the OpenClaw VM has on top of dev-env's
# packages.lst (dev-env's install.sh runs by hand, see the README). Desktop
# apps and image/boot packages left out.
zeroclaw_packages:
  - actionlint
  - ansible-core
  - ansible-lint
  - base-devel
  - bind
  - bun
  - cargo-ndk
  - chromium
  - claude-code
  - curl
  - docker
  - docker-compose
  - espflash
  - espup
  - gdu
  - git
  - github-cli
  - gitleaks
  - go-yq
  - helm
  - jdk17-openjdk
  - jdk25-openjdk
  - jq
  - k9s
  - kubectl
  - lazygit
  - ldproxy
  - minio-client
  - mosquitto
  - ndisc6
  - neovim
  - nmap
  - nodejs
  - npm
  - openai-codex
  - openscad
  - openssh
  - opentofu
  - perl
  - probe-rs
  - python
  - rsync
  - rustup
  - spotify-player
  - stow
  - tcpdump
  - tmux
  - unzip
  - wakeonlan
  - xorg-server-xvfb
  - yt-dlp
  - zip
# AUR, through yay from the chaotic-aur repository (dev-env uses the same).
zeroclaw_aur_packages:
  - gogcli-bin
# Not in the AUR: the upstream release's Arch package. Gives solidcraft-cli,
# the MCP server in zeroclaw-config.
zeroclaw_solidcraft_version: "0.30.1"
zeroclaw_solidcraft_sha256: 1dcb9f23201203765e51e360108c4d020985cef56317c4515952249e91f9113b
zeroclaw_solidcraft_package: solidcraft-{{ zeroclaw_solidcraft_version }}-linux-x86_64.pkg.tar.zst
zeroclaw_solidcraft_url: https://github.com/tangency-labs/solidcraft/releases/download/v{{ zeroclaw_solidcraft_version }}/{{ zeroclaw_solidcraft_package }}
# Rust targets: ESP32-C/nRF52 firmware and the Fastify core for Android.
# espup adds the Xtensa toolchain (esp) on top.
zeroclaw_rust_targets:
  - thumbv7em-none-eabihf
  - riscv32imac-unknown-none-elf
  - riscv32imafc-unknown-none-elf
  - riscv32imc-unknown-none-elf
  - aarch64-linux-android
  - x86_64-linux-android
# Android SDK in ~/.local/share/android-sdk (dev-env's ANDROID_HOME), same
# packages as the OpenClaw VM. The x86_64 image is the Fastify emulator's.
zeroclaw_android_cmdline_tools: commandlinetools-linux-16111833_latest.zip
zeroclaw_android_cmdline_tools_sha1: e025545c62a8e64c7559119566a569fb1dec5f60
zeroclaw_android_packages:
  - platform-tools
  - emulator
  - platforms;android-35
  - platforms;android-37.0
  - build-tools;35.0.0
  - build-tools;36.0.0
  - build-tools;37.0.0
  - ndk;30.0.16248370
  - system-images;android-35;google_apis;x86_64
