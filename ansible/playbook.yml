- name: Wait for fresh VMs
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # `cloud-init status --wait` never returns when cloud-init hangs, which
    # stalled deploys for hours. 15 minutes leaves room for the full package
    # upgrade on Arch.
    - name: Wait for cloud-init, explain a hang
      block:
        - name: Wait for cloud-init to finish
          ansible.builtin.command: timeout 900 cloud-init status --wait
          changed_when: false

      rescue:
        - name: Read cloud-init status
          ansible.builtin.shell: |
            cloud-init status --long
            echo
            sudo tail -n 30 /var/log/cloud-init-output.log
          register: cloud_init_debug
          changed_when: false
          failed_when: false

        - name: Report the stuck cloud-init
          ansible.builtin.fail:
            msg: |
              {{ 'cloud-init did not finish within 15 minutes' if cloud_init_rc | int == 124 else 'cloud-init failed (exit code ' ~ cloud_init_rc ~ ')' }}.
              {{ cloud_init_debug.stdout | default('') }}
          vars:
            cloud_init_rc: "{{ ansible_failed_result.rc | default('unknown') }}"

- name: Manage SSH keys
  hosts: all
  gather_facts: false
  roles:
    - ssh_keys

- name: Install SeaweedFS
  hosts: object_storage
  become: true
  roles:
    - seaweedfs

# Server first, so the agents can join it.
- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - role: k3s
      vars:
        k3s_role: server

- name: Install k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - role: k3s
      vars:
        k3s_role: agent

- name: Install Tailscale subnet router
  hosts: tailscale_router
  become: true
  roles:
    - tailscale_router

- name: Install OpenClaw
  hosts: openclaw_gateway
  roles:
    - openclaw

- name: Install Home Assistant
  hosts: home_assistant
  become: true
  roles:
    - home_assistant

- name: Install AdGuard Home
  hosts: adguard_home
  become: true
  roles:
    - adguard_home

- name: Install reverse proxy
  hosts: reverse_proxy
  become: true
  roles:
    - caddy
