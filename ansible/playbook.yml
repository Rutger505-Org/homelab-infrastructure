- name: Wait for fresh VMs
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

- name: Manage SSH keys
  hosts: all
  gather_facts: false
  roles:
    - ssh_keys

- name: Install SeaweedFS
  hosts: seaweedfs
  become: true
  roles:
    - seaweedfs

# Server first, so the agents can join it.
- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - role: k3s
      vars:
        k3s_role: server

- name: Install k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - role: k3s
      vars:
        k3s_role: agent

- name: Install Tailscale subnet router
  hosts: tailscale_router
  become: true
  roles:
    - tailscale_router

- name: Install OpenClaw
  hosts: openclaw_gateway
  roles:
    - openclaw
