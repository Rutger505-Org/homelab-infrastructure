- name: Wait for fresh VMs
  hosts: all:!manual
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

- name: Manage SSH keys
  hosts: all
  gather_facts: false
  roles:
    - ssh_keys

- name: Install SeaweedFS
  hosts: seaweedfs
  become: true
  roles:
    - seaweedfs
