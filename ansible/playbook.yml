- name: Wait for fresh VMs
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

- name: Join the tailnet
  hosts: all
  become: true
  roles:
    - tailscale

- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - k3s

- name: Install k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - k3s
