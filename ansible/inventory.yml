# Single source of truth for the guests: OpenTofu creates a VM or LXC
# container for every host below, Ansible configures it. vm_id, proxmox_node,
# cores, memory, memory_min, disk_size and data_disk_size are read by OpenTofu
# only and all required, there are no defaults (data_disk_size: 0 for no data
# disk). `os` is the exception: debian unless set to arch.
#
# VM or container: home-network services (DNS, reverse proxy, Tailscale, Home
# Assistant) are unprivileged LXC containers (`guest_type: lxc`), everything
# reachable from the internet (k3s, its storage) stays a VM for the stronger
# isolation. Containers:
# - Debian 13 template, no cloud-init: only root, so `ansible_user: root` and
#   `ansible_become: false` (there is no sudo).
# - no memory_min: memory is a limit, not a reservation (see below).
# - data_disk_size needs data_disk_path, where Proxmox mounts the volume.
#
# Boot order: startup_order (lower starts first) and startup_up_delay
# (seconds before the next guest starts), both optional. DNS starts first so
# the other guests resolve on boot; after a node crash guests came up without
# it.
# - 1: adguard-1, adguard-2 (DNS/DHCP)
# - 2: tailscale, tailscale-2, reverse-proxy
# - 3: seaweedfs
# - 4: k3s
# - unset: the rest, after the ordered guests
# - lxc_keyctl: true for Docker, lxc_devices for host devices (/dev/net/tun).
#
# Node memory: proxmox-lade has 16 GB, proxmox-prodesk 8 GB, and Proxmox
# itself needs some of that. Every VM has a balloon device: `memory` is the
# maximum, `memory_min` what Proxmox leaves the guest when the node runs
# above 80% RAM. The `memory` sums may go over the node, the `memory_min`
# sums must fit. k3s nodes keep a high minimum: the kubelet reads the node's
# memory once at start and does not see the balloon, so a shrunk node gets
# the guest OOM killer instead of pod evictions. A container's `memory` is a
# cgroup limit: the node only gives it what its processes use, with no guest
# kernel or page cache of its own on top.
# - proxmox-lade: VMs memory 13 GB, memory_min 11 GB; containers 0.75 GB
# - proxmox-prodesk: VMs memory 5.5 GB, memory_min 4 GB; containers 3 GB
#
# Redundancy: DNS/DHCP (adguard) and the Tailscale subnet router run once on
# each node, so either node can go down without taking the LAN's DNS or the
# tailnet route with it.
#
# LAN addresses (192.168.178.x, static, outside the router's DHCP range):
# - .199-.200: Proxmox nodes
# - .201-.229: VMs
# - .230-.250: MetalLB, Kubernetes LoadBalancer services
# Changing ansible_host changes the VM's cloud-init network config; the VM
# picks it up on its next boot.
#
# IPv6: the modem only hands out addresses over DHCPv6, which the Debian VMs do
# not use, so a host that needs a fixed IPv6 address sets ipv6_host: the
# interface id in hex, appended to lan_ipv6_prefix (e.g. "53" =>
# 2001:1c07:589:7900::53). The prefix comes from Ziggo; if it ever changes,
# update lan_ipv6_prefix and every address follows.
all:
  vars:
    lan_ipv6_prefix: 2001:1c07:589:7900::/64
    ansible_user: debian
    # Exact contents of ~/.ssh/authorized_keys for ansible_user on every host
    # below; keys not listed here are removed on deploy. Also used by
    # cloud-init for new VMs. Must keep the homelab-ci key, CI logs in with it.
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN6UkH6YxTSa4wR6df7ISkaz0UHmmEswG2M3/8AV5ebL rutger@rutger-laptop-omarchy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICaVEo3BA5BZHtu5shSj/aLYBFT5pxkBMOk69lw/ewWK rutger@rutger-desktop-omarchy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWqMziuQxU76b0XIGdBuk48tjN71/D4FGZst0W3Mkya rutger@rutger-cheapcargo-laptop-omarchy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAzdG1/zOJzA5TzmRdGS6O/iCEAirVxAFLAbbYyuJeaN homelab-ci
  children:
    object_storage:
      hosts:
        seaweedfs:
          ansible_host: 192.168.178.214
          vm_id: 904
          proxmox_node: proxmox-prodesk
          # A single core could not keep up with a large upload: the volume
          # server stopped answering, chunk uploads timed out and piled up in
          # memory until the OOM killer stopped weed.
          cores: 3
          memory: 2048
          # At 512 the balloon held it near its floor on prodesk: ~440 MB
          # usable, 97% used, the guest agent stopped answering. weed alone
          # takes ~350 MB; 1 GB keeps room for the OS and the agent.
          memory_min: 1024
          disk_size: 10
          data_disk_size: 60
          startup_order: 3
    k3s_server:
      hosts:
        k3s-1:
          ansible_host: 192.168.178.201
          vm_id: 911
          proxmox_node: proxmox-lade
          cores: 4
          memory: 5120
          memory_min: 4096
          disk_size: 20
          data_disk_size: 0
          startup_order: 4
    k3s_agent:
      hosts:
        k3s-2:
          ansible_host: 192.168.178.202
          vm_id: 912
          proxmox_node: proxmox-prodesk
          cores: 4
          # Less than k3s-1: prodesk only has 8 GB.
          memory: 3584
          memory_min: 3072
          disk_size: 20
          data_disk_size: 0
          startup_order: 4
    tailscale_router:
      hosts:
        tailscale:
          guest_type: lxc
          ansible_host: 192.168.178.216
          ansible_user: root
          ansible_become: false
          vm_id: 923
          proxmox_node: proxmox-lade
          cores: 1
          memory: 256
          disk_size: 4
          data_disk_size: 0
          startup_order: 2
          lxc_devices:
            - /dev/net/tun
        # Second router on the other node, advertising the same route.
        # Tailscale fails over to it when the primary goes offline.
        tailscale-2:
          guest_type: lxc
          ansible_host: 192.168.178.217
          ansible_user: root
          ansible_become: false
          vm_id: 924
          proxmox_node: proxmox-prodesk
          cores: 1
          memory: 256
          disk_size: 4
          data_disk_size: 0
          startup_order: 2
          lxc_devices:
            - /dev/net/tun
    openclaw_gateway:
      hosts:
        openclaw:
          ansible_host: 192.168.178.210
          vm_id: 910
          proxmox_node: proxmox-lade
          os: arch
          ansible_user: openclaw
          cores: 6
          # No balloon headroom: the gateway plus the Fastify Android emulator
          # and Gradle builds need all 6 GB; at 4 GB the guest swapped and the
          # OOM killer stopped the emulator.
          memory: 6144
          memory_min: 6144
          disk_size: 65
          data_disk_size: 0
          openclaw_gateway_enabled: true
    home_assistant:
      hosts:
        home-assistant:
          guest_type: lxc
          ansible_host: 192.168.178.215
          ansible_user: root
          ansible_become: false
          vm_id: 925
          proxmox_node: proxmox-prodesk
          cores: 2
          memory: 2048
          # Docker images and their layers.
          disk_size: 12
          data_disk_size: 10
          data_disk_path: /srv/home-assistant
          lxc_keyctl: true
    # No host may be called "adguard" too: --limit then picks only that host
    # instead of the group, and deploys skipped adguard-2.
    adguard:
      hosts:
        adguard-1:
          guest_type: lxc
          ansible_host: 192.168.178.205
          ansible_user: root
          ansible_become: false
          # 2001:1c07:589:7900::53, set as IPv6 DNS server in the modem: it
          # refuses a private IPv4 address, and IPv6 clients would otherwise
          # bypass AdGuard Home.
          ipv6_host: "53"
          vm_id: 926
          proxmox_node: proxmox-prodesk
          cores: 1
          memory: 512
          disk_size: 4
          data_disk_size: 0
          # DNS for every other guest, so it starts first.
          startup_order: 1
          startup_up_delay: 15
          # Each instance leases its own half of the pool, so the two never
          # hand out the same address (AdGuard Home has no DHCP failover).
          adguard_dhcp_range_start: 192.168.178.20
          adguard_dhcp_range_end: 192.168.178.100
        # Second DNS/DHCP server on the other node.
        adguard-2:
          guest_type: lxc
          ansible_host: 192.168.178.206
          ansible_user: root
          ansible_become: false
          # 2001:1c07:589:7900::54, the modem's secondary IPv6 DNS server.
          ipv6_host: "54"
          vm_id: 928
          proxmox_node: proxmox-lade
          cores: 1
          memory: 512
          disk_size: 4
          data_disk_size: 0
          startup_order: 1
          startup_up_delay: 15
          adguard_dhcp_range_start: 192.168.178.101
          adguard_dhcp_range_end: 192.168.178.180
    reverse_proxy:
      hosts:
        reverse-proxy:
          guest_type: lxc
          ansible_host: 192.168.178.207
          ansible_user: root
          ansible_become: false
          vm_id: 927
          proxmox_node: proxmox-prodesk
          cores: 1
          memory: 256
          disk_size: 4
          data_disk_size: 0
          startup_order: 2
    # Throwaway prototype: ZeroClaw as a possible replacement for OpenClaw.
    zeroclaw_gateway:
      hosts:
        zeroclaw:
          ansible_host: 192.168.178.218
          vm_id: 913
          proxmox_node: proxmox-lade
          # Arch, like the OpenClaw VM it may replace.
          os: arch
          ansible_user: zeroclaw
          cores: 6
          memory: 2048
          memory_min: 1024
          disk_size: 20
          data_disk_size: 0
          # The OpenClaw VM, so its agent can check and set up this VM.
          ssh_extra_authorized_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDjhA21XhwvSlL8x41gyQAbZWzfxF2h9V0gWpxD3LXwT openclaw-vm-managed
