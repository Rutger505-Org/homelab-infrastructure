# Single source of truth for the VMs: OpenTofu creates a VM for every
# host below, Ansible configures it. vm_id, proxmox_node, cores, memory,
# disk_size and data_disk_size are read by OpenTofu only and all required,
# there are no defaults (data_disk_size: 0 for no data disk). `os` is the
# exception: debian unless set to arch.
#
# Node memory: proxmox-lade has 16 GB, proxmox-prodesk 8 GB, and Proxmox
# itself needs some of that. `memory` is a maximum, not a reservation, so the
# sums below may go over as long as the VMs do not all use their maximum at
# once. Hand-built VMs (proxmox/manual-vms.tf) count too until they are removed.
# - proxmox-lade: 13.5 GB here, plus 6.5 GB hand-built
# - proxmox-prodesk: 6.5 GB here
#
# LAN addresses (192.168.178.x, static, outside the router's DHCP range):
# - .199-.200: Proxmox nodes
# - .201-.229: VMs, a VM keeps the address of the VM it replaced
# - .230-.250: MetalLB, Kubernetes LoadBalancer services
# Changing ansible_host changes the VM's cloud-init network config; the VM
# picks it up on its next boot.
all:
  vars:
    ansible_user: debian
    # Exact contents of ~/.ssh/authorized_keys for ansible_user on every host
    # below; keys not listed here are removed on deploy. Also used by
    # cloud-init for new VMs. Must keep the homelab-ci key, CI logs in with it.
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN6UkH6YxTSa4wR6df7ISkaz0UHmmEswG2M3/8AV5ebL rutger@rutger-laptop-omarchy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICaVEo3BA5BZHtu5shSj/aLYBFT5pxkBMOk69lw/ewWK rutger@rutger-desktop-omarchy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWqMziuQxU76b0XIGdBuk48tjN71/D4FGZst0W3Mkya rutger@rutger-cheapcargo-laptop-omarchy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAzdG1/zOJzA5TzmRdGS6O/iCEAirVxAFLAbbYyuJeaN homelab-ci
  children:
    seaweedfs:
      hosts:
        seaweedfs-server:
          ansible_host: 192.168.178.214
          vm_id: 904
          proxmox_node: proxmox-lade
          cores: 1
          memory: 1024
          disk_size: 10
          data_disk_size: 60
    k3s_server:
      hosts:
        k3s-1:
          ansible_host: 192.168.178.201
          vm_id: 911
          proxmox_node: proxmox-lade
          cores: 4
          memory: 6144
          disk_size: 20
          data_disk_size: 0
    k3s_agent:
      hosts:
        k3s-2:
          ansible_host: 192.168.178.202
          vm_id: 912
          proxmox_node: proxmox-prodesk
          cores: 4
          # Less than k3s-1: prodesk only has 8 GB.
          memory: 4096
          disk_size: 20
          data_disk_size: 0
    # tailscale and openclaw replace the hand-built Tailscale and OpenClaw VMs
    # (proxmox/manual-vms.tf), which keep running next to them until cut over.
    tailscale_router:
      hosts:
        tailscale:
          ansible_host: 192.168.178.213
          vm_id: 913
          proxmox_node: proxmox-lade
          cores: 1
          memory: 512
          disk_size: 8
          data_disk_size: 0
    openclaw_gateway:
      hosts:
        openclaw:
          ansible_host: 192.168.178.210
          vm_id: 910
          proxmox_node: proxmox-lade
          os: arch
          ansible_user: openclaw
          # The hand-built OpenClaw VM's key, so it can move its own state
          # here at cutover. Remove once the old VM is gone.
          ssh_extra_authorized_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK5DCkjLrATKWR+HrrelHjHsNXw9y8i4wdnoNsmHqlNn openclaw@openclaw
          cores: 4
          memory: 6144
          disk_size: 65
          data_disk_size: 0
          # Off until the state is moved over from the old VM: two Gateways
          # with the same channel credentials would both answer.
          openclaw_gateway_enabled: false
    home_assistant:
      hosts:
        home-assistant:
          ansible_host: 192.168.178.215
          vm_id: 905
          proxmox_node: proxmox-prodesk
          cores: 2
          memory: 2048
          disk_size: 16
          data_disk_size: 10
    adguard_home:
      hosts:
        adguard-home:
          ansible_host: 192.168.178.205
          vm_id: 906
          proxmox_node: proxmox-prodesk
          cores: 1
          memory: 512
          disk_size: 8
          data_disk_size: 0
    reverse_proxy:
      hosts:
        reverse-proxy:
          ansible_host: 192.168.178.207
          vm_id: 907
          proxmox_node: proxmox-prodesk
          cores: 1
          memory: 512
          disk_size: 8
          data_disk_size: 0
