name: Deploy internal DNS

on:
  push:
    branches:
      - main
    paths:
      - internal-dns/**
      - .github/workflows/internal-dns.yaml
  # A rebuilt AdGuard VM starts without rewrites; re-create them after every
  # homelab deploy so they come back on their own.
  workflow_run:
    workflows: [Deploy homelab]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - internal-dns/**
      - .github/workflows/internal-dns.yaml
  workflow_dispatch:

concurrency:
  group: internal-dns
  cancel-in-progress: false

jobs:
  internal-dns:
    name: AdGuard Home rewrites
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ vars.R2_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      ADGUARD_PASSWORD: ${{ secrets.ADGUARD_ADMIN_PASSWORD }}

    defaults:
      run:
        working-directory: ./internal-dns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CI_HOMELAB_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CI_HOMELAB_OAUTH_SECRET }}
          tags: tag:ci-homelab
          # renovate: datasource=github-releases depName=tailscale/tailscale extractVersion=^v(?<version>.+)$
          version: 1.104.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.+)$
          tofu_version: 1.13.0
          tofu_wrapper: false

      - name: OpenTofu init
        run: tofu init -input=false

      - name: OpenTofu plan
        if: github.event_name == 'pull_request'
        run: tofu plan -input=false -lock=false

      - name: OpenTofu apply
        if: github.event_name != 'pull_request'
        run: tofu apply -input=false -auto-approve
